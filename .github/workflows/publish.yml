# Republie le site sur kaleysur.github.io a chaque evolution de main.
#
# Le depot Kaleysur/kaleysur.github.io est un MIROIR : il ne contient pas
# d'historique propre, on y ecrase simplement l'etat courant de main. C'est
# pour ca que le push est force — sans lui, un miroir divergent bloquerait
# toutes les publications suivantes.
#
# Prerequis (une seule fois) : un secret PAGES_TOKEN contenant un jeton
# d'acces personnel autorise en ecriture sur Kaleysur/kaleysur.github.io.

name: Publier sur kaleysur.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de republier a la demande

concurrency:
  group: publication-pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le jeton est configure
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Le secret PAGES_TOKEN est absent."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Pousser vers le depot de publication
        env:
          TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add pages "https://x-access-token:${TOKEN}@github.com/Kaleysur/kaleysur.github.io.git"
          git push --force pages HEAD:refs/heads/main
          echo "Publie : https://kaleysur.github.io"
